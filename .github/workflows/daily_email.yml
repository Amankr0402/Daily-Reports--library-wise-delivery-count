name: Automated Daily Sales Report Email

on:
  schedule:
    # Multiple offset triggers around 10:00 AM IST to bypass GitHub queue delays
    - cron: '25 4 * * *'   # 09:55 AM IST
    - cron: '30 4 * * *'   # 10:00 AM IST
    - cron: '35 4 * * *'   # 10:05 AM IST
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Sync latest live data
        run: node scripts/sync_sheets.js

      - name: Send Daily Sales Report Email
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER || 'aman.soni@theelefant.ai' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || 'hlbncuynxydsehha' }}
          SMTP_FROM: ${{ secrets.SMTP_FROM || '"Aman Soni" <aman.soni@theelefant.ai>' }}
        run: node scripts/send_report_now.js
